<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaVault | Books</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="book-page">
<div class="header">
  <div class="container">
    <div class="navbar">
      <a href="index.html">
        <img src="images/logo.png" width="150">
      </a>
      <nav>
          <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="games.html">Games</a></li>
              <li><a href="movie.html">Movies</a></li>
              <li><a href="book.html" class="active">Books</a></li>
              <li><a href="about.html">About</a></li>
              <li><div class="search-box">
                  <input type="search" class="search" placeholder="Search books...">
                  <i class="fa-solid fa-magnifying-glass"></i></div></li>
              <li><a href="#" class="icon-cart">
                  <i class="fa-solid fa-cart-shopping"></i>
                  <span id="cart-count">0</span>
              </a></li>
          </ul>
      </nav>
    </div>
  </div>
</div>

<section class="shop-section">
    <div class="hero-header">
        <h1>ULTIMATE <span class="neon-text">BOOK</span> STORE</h1>
        <p>Expand your horizon with our legendary collection</p>
    </div>
    <div class="glass-container">
        <h2 class="section-title">Featured Books</h2>
        <div class="games-grid" id="gameGrid"></div>
    </div>
</section>

<div id="libraryOverlay" class="library-overlay">
    <div class="library-content">
        <div class="library-header">
            <h1><i class="fa-solid fa-layer-group"></i> My Library</h1>
            <button id="closeLibrary" class="cross-btn">&times;</button>
        </div>
        <div class="table-wrapper">
            <table class="library-table">
                <thead>
                    <tr>
                        <th>Items Added</th>
                        <th>Original Price</th>
                        <th>Discount (10%)</th>
                        <th>Total Paid</th>
                        <th>Action</th> </tr>
                    </tr>
                </thead>
                <tbody id="libraryTableBody"></tbody>
            </table>
        </div>
        <div class="library-footer">
            <h3>Total Value: <span id="libraryGrandTotal">$0.00</span></h3>
        </div>
    </div>
</div>

<br><br><hr><br><br>

    <footer>
    <div class="footer-container">
        <div class="footer-left">
        <a href="about.html#feedback-section">Contact Us</a>
        <a href="about.html#feedback-section">Feedback</a>
        <a href="/terms">Terms & Policy</a>
        </div>

        <div class="footer-right">
        <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#" class="social-icon"><i class="fa-brands fa-youtube"></i></a>
        <a href="#" class="social-icon"><i class="fa-brands fa-square-facebook"></i></a>
        </div>
  </div>
</footer>
<br><br><hr>

<script src="script2.js" defer></script>
</body>
</html>
